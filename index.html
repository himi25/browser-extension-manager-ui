<html>
<head>
    <title>My First Challenge</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Correct CSS path -->
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
    <div class="searchbar">
        <!-- Use relative path for images -->
        <img src="assets/images/logo.svg" alt="Logo">
        <div class="theme">
            <img id="mode" src="assets/images/icon-sun.svg" alt="Theme Icon">
        </div>
    </div>

    <div class="heading">
        <h1>Extensions List</h1>
        <div class="status">
            <div id="all" class="theme">All</div>
            <div id="active" class="theme">Active</div>
            <div id="inactive" class="theme">Inactive</div>
        </div>
    </div>

    <!-- CARD -->
    <div class="cards">
        <div class="card">
            <div class="about">
                <img src="assets/images/logo-devlens.svg" alt="DevLens Logo">
                <div class="description">
                    <h2 id="name">DevLens</h2>
                    <p id="desc">Quickly inspect page layouts and visualize element boundaries.</p>
                </div>
            </div>

            <div class="toggle">
                <div class="theme">Remove</div>
                <label class="switch">
                    <input type="checkbox">
                    <span class="slider round"></span>
                </label>
            </div>
        </div>
    </div>

    <!-- Correct JS path -->
    <script src="script.js"></script>
</body>
</html>
